<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cabeçalho do site</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<header style="width: 100%; border-bottom: 1px solid #E2E6EA; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; color: #0E1726">
<div style="max-width: 1360px; margin: 0 auto; padding: 14px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px; box-sizing: border-box">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 14px; text-decoration: none; color: #0E1726">
<dc-import name="Logo" cell="{{ 3 }}" color="#008BBB" hint-size="47px,20px"></dc-import>
<span style="font-family: Anton, sans-serif; font-size: 18px; letter-spacing: 0.5px; text-transform: uppercase; border-left: 1px solid #CBD2D9; padding-left: 14px">Manual do aluno</span>
</a>
<nav aria-label="Principal" style="display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 auto">
<sc-for list="{{links}}" as="l" hint-placeholder-count="4">
<a href="{{l.href}}" style="padding: 10px 14px; text-decoration: none; color: {{l.color}}; font-weight: {{l.w}}; font-size: 15px; border-bottom: 3px solid {{l.b}}">{{l.t}}</a>
</sc-for>
</nav>
<label style="position: relative; display: flex; align-items: center; gap: 8px; border: 1px solid #CBD2D9; padding: 0 12px; height: 44px; min-width: 220px; box-sizing: border-box; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #4A5568">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A5568" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar no manual</span>
<input type="search" placeholder="Buscar no manual" style="border: 0; outline: 0; font: inherit; color: #0E1726; background: transparent; width: 100%">
</label>
<a href="#" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; background: #008BBB; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 14px">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg>
Baixar PDF</a>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ativo":{"editor":"enum","options":["inicio","ufabc","bct","bcc"],"default":"ufabc"},"$preview":{"width":1440,"height":77}}'>
class Component extends DCLogic {
  renderVals() {
    const on = this.props.ativo ?? 'ufabc';
    const items = [['inicio', 'Início', 'Main.dc.html'], ['ufabc', 'UFABC', 'Campi.dc.html'], ['bct', 'BC&T', 'MatrizBCT.dc.html'], ['bcc', 'BCC', 'Grade.dc.html']];
    return {
      links: items.map(([k, t, href]) => k === on
        ? { t, href, color: '#0E1726', w: 600, b: '#008BBB' }
        : { t, href, color: '#4A5568', w: 500, b: 'transparent' })
    };
  }
}
</script>
</body>
</html>

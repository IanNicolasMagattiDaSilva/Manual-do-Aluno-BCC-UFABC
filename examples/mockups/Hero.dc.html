<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Título de página</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; min-height: 220px; background: {{t.bg}}; padding: 36px 36px 32px; position: relative; overflow: hidden; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; color: {{t.title}}">
<div aria-hidden="true" style="position: absolute; right: 0; top: 0; width: 460px; height: 280px">
<dc-import name="Wafer" tema="{{ tema }}" w="{{ 460 }}" h="{{ 280 }}" die="{{ 76 }}" ax="{{ 1 }}" ay="{{ 0.3 }}" seed="{{ seed }}" fundo="{{ false }}" hint-size="460px,280px"></dc-import>
</div>
<p style="position: relative; margin: 0 0 8px; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: {{t.text}}">{{parte}}</p>
<h1 style="position: relative; margin: 0; font-family: Anton, sans-serif; font-weight: 400; font-size: 64px; line-height: 1; text-transform: uppercase; max-width: 520px">{{titulo}}</h1>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"parte":{"editor":"text","default":"Parte 1 · UFABC"},"titulo":{"editor":"text","default":"Campi e cursos"},"tema":{"editor":"enum","options":["amarelo","azul"],"default":"amarelo"},"seed":{"editor":"int","default":11},"$preview":{"width":760,"height":220}}'>
class Component extends DCLogic {
  renderVals() {
    const tema = this.props.tema ?? 'amarelo';
    const t = tema === 'azul'
      ? { bg: '#008BBB', title: '#FFFFFF', text: '#04222F' }
      : { bg: '#FFCC00', title: '#0E1726', text: '#0E1726' };
    return { t, tema, parte: this.props.parte ?? 'Parte 1 · UFABC', titulo: this.props.titulo ?? 'Campi e cursos', seed: this.props.seed ?? 11 };
  }
}
</script>
</body>
</html>

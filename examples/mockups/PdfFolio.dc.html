<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Rodapé das páginas do PDF</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{w}}px; height: 36px; border-top: 1px solid #CBD2D9; display: flex; align-items: flex-end; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #4A5568; box-sizing: border-box">
<span style="letter-spacing: 2px; text-transform: uppercase">Manual do aluno · {{secao}}</span>
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; background: #FFCC00"></span><span style="font-weight: 700; color: #0E1726">{{num}}</span></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"secao":{"editor":"text","default":"Parte 1 · UFABC"},"num":{"editor":"text","default":"05"},"w":{"editor":"int","default":650},"$preview":{"width":650,"height":36}}'>
class Component extends DCLogic {
  renderVals() {
    return { secao: this.props.secao ?? 'Parte 1 · UFABC', num: this.props.num ?? '05', w: this.props.w ?? 650 };
  }
}
</script>
</body>
</html>
